# Native auto-merge. For this to actually gate, branch protection on `main`
# MUST mark the CI jobs `verify` and `e2e` as required status checks.
# Auto-merge only completes once every required check passes; without those
# checks being required, GitHub would merge as soon as they are merely queued.
name: auto-merge

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'automerge')
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
